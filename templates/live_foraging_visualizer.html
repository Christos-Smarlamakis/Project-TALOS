<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TALOS v5.10.11 -- 3D Knowledge Constellation (Vendored Three.js)</title>
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#0f1117; font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif; color:#e4e7ee; }
  #scene-container { position:absolute; top:0; left:0; width:100vw; height:100vh; z-index:1; }
  #scene-container canvas { display:block; cursor:grab; }
  #scene-container canvas.panning { cursor:move; }
  #scene-container canvas:active { cursor:grabbing; }
  #hud { position:fixed; top:24px; right:24px; width:350px; background:rgba(15,17,23,0.72); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border:1px solid rgba(0,102,153,0.35); border-radius:12px; padding:18px 20px; z-index:10; font-size:13px; line-height:1.5; }
  .hud-header { font-size:11px; text-transform:uppercase; letter-spacing:1.5px; color:#6b7280; margin-bottom:8px; }
  .hud-badge { display:inline-block; padding:3px 10px; border-radius:4px; font-size:11px; font-weight:600; margin-bottom:6px; }
  .hud-badge.DRL { background:rgba(0,206,209,0.18); color:#00ced1; }
  .hud-badge.Daily { background:rgba(0,102,153,0.22); color:#4a9eff; }
  .hud-badge.Historic { background:rgba(243,156,18,0.18); color:#f39c12; }
  .hud-title { font-size:14px; font-weight:600; color:#e4e7ee; margin-bottom:8px; word-break:break-word; }
  .hud-score { display:inline-block; padding:4px 12px; border-radius:6px; font-size:13px; font-weight:700; margin-bottom:6px; }
  .hud-score.ELITE { background:rgba(243,156,18,0.20); color:#f39c12; border:1px solid rgba(243,156,18,0.40); }
  .hud-score.ACCEPT { background:rgba(40,167,69,0.18); color:#28a745; border:1px solid rgba(40,167,69,0.35); }
  .hud-score.REJECT { background:rgba(220,53,69,0.18); color:#dc3545; border:1px solid rgba(220,53,69,0.35); }
  .hud-row { display:flex; justify-content:space-between; align-items:center; padding:4px 0; border-top:1px solid rgba(255,255,255,0.06); }
  .hud-row .label { color:#6b7280; font-size:11px; }
  .hud-row .value { font-weight:600; font-size:12px; }
  #controls { position:fixed; top:16px; left:16px; z-index:10; display:flex; flex-wrap:wrap; gap:8px; align-items:center; max-width:52vw; }
  .ctrl-btn { background:rgba(15,17,23,0.75); backdrop-filter:blur(8px); border:1px solid rgba(0,102,153,0.30); color:#b0bec5; padding:7px 14px; border-radius:6px; font-size:12px; cursor:pointer; transition:all 0.2s; white-space:nowrap; }
  .ctrl-btn:hover { border-color:rgba(0,206,209,0.55); color:#00ced1; }
  .ctrl-btn.active { background:rgba(0,206,209,0.12); border-color:#00ced1; color:#00ced1; }
  .ctrl-sep { width:1px; height:24px; background:rgba(255,255,255,0.10); margin:0 4px; }
  #mode-indicator { position:fixed; top:16px; left:50%; transform:translateX(-50%); z-index:10; background:rgba(15,17,23,0.70); border:1px solid rgba(0,102,153,0.30); border-radius:6px; padding:6px 16px; font-size:11px; letter-spacing:1px; color:#00ced1; text-transform:uppercase; }
  #replay { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); z-index:10; display:none; align-items:center; gap:10px; background:rgba(15,17,23,0.78); backdrop-filter:blur(10px); border:1px solid rgba(0,102,153,0.30); border-radius:10px; padding:10px 20px; }
  #replay.visible { display:flex; }
  #replay button { background:rgba(0,206,209,0.10); border:1px solid rgba(0,206,209,0.25); color:#b0bec5; padding:6px 12px; border-radius:5px; cursor:pointer; font-size:12px; }
  #replay input[type=range] { width:220px; accent-color:#00ced1; }
  #replay span { font-size:11px; color:#6b7280; min-width:90px; text-align:center; }
  #legend { position:fixed; bottom:24px; left:24px; z-index:10; background:rgba(15,17,23,0.72); backdrop-filter:blur(10px); border:1px solid rgba(0,102,153,0.30); border-radius:10px; padding:12px 16px; font-size:11px; line-height:1.9; }
  #legend .lg { display:flex; align-items:center; gap:8px; }
  #legend .dot { width:10px; height:10px; border-radius:50%; display:inline-block; }
  body.print-theme { background:#ffffff; color:#0f1117; }
  body.print-theme #hud, body.print-theme #controls .ctrl-btn, body.print-theme #replay, body.print-theme #legend, body.print-theme #mode-indicator { background:rgba(255,255,255,0.94); border-color:rgba(0,40,85,0.35); color:#0f1117; }
  body.print-theme .hud-header, body.print-theme .hud-row .label { color:#5b6470; }
  body.print-theme .hud-title { color:#0f1117; }
  body.print-theme .hud-row { border-top:1px solid rgba(0,40,85,0.10); }
  body.print-theme .ctrl-btn { color:#33414f; }
  body.print-theme .ctrl-btn:hover, body.print-theme .ctrl-btn.active { color:#002855; border-color:#002855; }
  body.print-theme #mode-indicator { color:#002855; }
</style>
</head>
<body>
<div id="scene-container"></div>

<div id="controls">
  <button class="ctrl-btn active" id="btn-live">LIVE</button>
  <button class="ctrl-btn" id="btn-replay">REPLAY</button>
  <span class="ctrl-sep"></span>
  <button class="ctrl-btn" id="btn-theme">THEME</button>
  <button class="ctrl-btn" id="btn-reset">RESET VIEW</button>
</div>

<div id="mode-indicator">LIVE AJAX POLLING</div>

<div id="hud">
  <div class="hud-header">Latest Evaluation</div>
  <div><span class="hud-badge DRL" id="hud-pipeline">DRL / DAILY</span></div>
  <div class="hud-title" id="hud-title">Awaiting telemetry...</div>
  <span class="hud-score ACCEPT" id="hud-score">--</span>
  <div class="hud-row"><span class="label">DRL Reward</span><span class="value" id="hud-reward">--</span></div>
  <div class="hud-row"><span class="label">Provider</span><span class="value" id="hud-provider">--</span></div>
  <div class="hud-row"><span class="label">Source</span><span class="value" id="hud-source">--</span></div>
</div>

<div id="replay">
  <button id="rp-play">PLAY</button>
  <button id="rp-speed" data-speed="1">1x</button>
  <input type="range" id="rp-timeline" min="0" max="0" value="0" step="1">
  <span id="rp-status">0 / 0</span>
</div>

<div id="legend">
  <div class="lg"><span class="dot" style="background:#10b981"></span> Healthy</div>
  <div class="lg"><span class="dot" style="background:#f59e0b"></span> Cooldown</div>
  <div class="lg"><span class="dot" style="background:#ef4444"></span> Error / 403</div>
  <div class="lg"><span class="dot" style="background:#06b6d4"></span> Standby</div>
</div>

<script src="/static/js/three.min.js"></script>
<script>
(function () {
  'use strict';

  // -- Canonical 16-source list (mirrors src/ai/drl/talos_env.py) --
  var SOURCE_NAMES = ["arxiv","openalex","semantic_scholar","crossref","dblp",
    "pubmed","plos","core","osti","scigov",
    "openarchives","ieee","elsevier","springer","openreview","openaire"];
  var SOURCE_LABELS = ["arXiv","OpenAlex","Semantic Scholar","Crossref","DBLP",
    "PubMed","PLOS","CORE","OSTI.gov","Science.gov",
    "OpenArchives","IEEE","Elsevier","Springer","OpenReview","OpenAIRE"];

  var STATE_COLORS = { healthy: 0x10b981, cooldown: 0xf59e0b, error: 0xef4444, standby: 0x06b6d4 };

  var printTheme = false;
  var currentMode = 'live';

  var container = document.getElementById('scene-container');
  var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(0x0f1117, 1);
  container.appendChild(renderer.domElement);

  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 200);

  scene.add(new THREE.AmbientLight(0xffffff, 0.6));
  var keyLight = new THREE.DirectionalLight(0xffffff, 0.8);
  keyLight.position.set(5, 8, 6);
  scene.add(keyLight);
  var fillLight = new THREE.PointLight(0x00ced1, 0.5, 30);
  fillLight.position.set(-6, -2, -4);
  scene.add(fillLight);

  var orbit = { theta: 0, phi: Math.PI / 6, radius: 14 };
  var panTarget = new THREE.Vector3(0, 0, 0);

  var grid = null;
  function buildGrid(print) {
    if (grid) { scene.remove(grid); grid.geometry.dispose(); grid.material.dispose(); }
    grid = new THREE.GridHelper(18, 18, print ? 0x6688aa : 0x224466, print ? 0xdde3ea : 0x16202c);
    scene.add(grid);
  }
  buildGrid(false);

  var coreMat = new THREE.MeshBasicMaterial({ color: 0xf39c12, wireframe: true });
  var core = new THREE.Mesh(new THREE.IcosahedronGeometry(1.25, 1), coreMat);
  scene.add(core);
  var innerMat = new THREE.MeshBasicMaterial({ color: 0xf39c12, wireframe: true, transparent: true, opacity: 0.5 });
  var innerCore = new THREE.Mesh(new THREE.IcosahedronGeometry(0.55, 1), innerMat);
  scene.add(innerCore);

  var lineGroup = new THREE.Group();
  scene.add(lineGroup);
  var coreLineMat = new THREE.LineBasicMaterial({ color: 0x2a3a4f, transparent: true, opacity: 0.55 });
  var meshMat = new THREE.LineBasicMaterial({ color: 0x1a2634, transparent: true, opacity: 0.30 });
  // -- Fibonacci spherical distribution (golden angle) --
  function fibonacciSphere(i, n, radius) {
    var y = 1 - (i / (n - 1)) * 2;
    var rAtY = Math.sqrt(Math.max(0, 1 - y * y));
    var theta = i * 2.399963229728653;
    return new THREE.Vector3(Math.cos(theta) * rAtY * radius, y * radius, Math.sin(theta) * rAtY * radius);
  }

  // -- Soft radial glow texture for health aura sprites --
  var glowTextureCache = {};
  function makeGlowTexture(hex) {
    if (glowTextureCache[hex]) return glowTextureCache[hex];
    var size = 128;
    var c = document.createElement('canvas');
    c.width = c.height = size;
    var ctx = c.getContext('2d');
    var r = (hex >> 16) & 255, g = (hex >> 8) & 255, b = hex & 255;
    var grad = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
    grad.addColorStop(0, 'rgba(' + r + ',' + g + ',' + b + ',0.85)');
    grad.addColorStop(0.35, 'rgba(' + r + ',' + g + ',' + b + ',0.35)');
    grad.addColorStop(1, 'rgba(' + r + ',' + g + ',' + b + ',0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, size, size);
    var tex = new THREE.CanvasTexture(c);
    tex.needsUpdate = true;
    glowTextureCache[hex] = tex;
    return tex;
  }

  // -- Per-node counter badge (canvas-backed sprite) --
  function makeCounterSprite() {
    var c = document.createElement('canvas');
    c.width = 64; c.height = 64;
    var tex = new THREE.CanvasTexture(c);
    var mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false });
    var spr = new THREE.Sprite(mat);
    spr.scale.set(0.55, 0.55, 1);
    return { sprite: spr, canvas: c, tex: tex };
  }
  function drawCounter(counter, count) {
    var ctx = counter.canvas.getContext('2d');
    ctx.clearRect(0, 0, 64, 64);
    if (count <= 0) return;
    ctx.fillStyle = printTheme ? '#002855' : '#00ced1';
    ctx.font = 'bold 28px Segoe UI, Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(String(count), 32, 34);
    counter.tex.needsUpdate = true;
  }

  // -- Theme-adaptive floating label badge (canvas-backed billboard sprite) --
  function makeLabelSprite(text) {
    var c = document.createElement('canvas');
    c.width = 256; c.height = 64;
    var tex = new THREE.CanvasTexture(c);
    tex.minFilter = THREE.LinearFilter;
    tex.magFilter = THREE.LinearFilter;
    var mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false, depthWrite: false });
    var spr = new THREE.Sprite(mat);
    spr.scale.set(1.6, 0.4, 1);
    drawLabel({ canvas: c, tex: tex }, text);
    return { sprite: spr, canvas: c, tex: tex };
  }
  function drawLabel(label, text) {
    var ctx = label.canvas.getContext('2d');
    ctx.clearRect(0, 0, 256, 64);
    ctx.font = 'bold 30px Segoe UI, Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    if (printTheme) {
      // Academic print mode: high-contrast dark navy for paper screenshots.
      ctx.fillStyle = '#002855';
      ctx.fillText(text, 128, 32);
    } else {
      // Dark mode: cyan-white text with a soft dark shadow for legibility.
      ctx.shadowColor = 'rgba(0, 0, 0, 0.9)';
      ctx.shadowBlur = 8;
      ctx.fillStyle = '#e0f2fe';
      ctx.fillText(text, 128, 32);
    }
    label.tex.needsUpdate = true;
  }

  // -- Build the 16 satellite source nodes --
  // v5.10.11: refined proportions -- sphere radius 0.24 (35% scaled-down from
  // the original 0.37), aura halo sized at 2.2x the node diameter, and a
  // floating theme-adaptive label badge above every node.
  var NODE_RADIUS = 0.24;
  var AURA_SCALE = NODE_RADIUS * 2 * 2.2;
  var nodeData = [];
  for (var i = 0; i < 16; i++) {
    var pos = fibonacciSphere(i, 16, 4.5);
    var group = new THREE.Group();
    group.position.copy(pos);

    var sphere = new THREE.Mesh(
      new THREE.SphereGeometry(NODE_RADIUS, 24, 24),
      new THREE.MeshPhongMaterial({ color: 0x00ced1, emissive: 0x003333, shininess: 40 })
    );
    group.add(sphere);

    var auraMat = new THREE.SpriteMaterial({ map: makeGlowTexture(STATE_COLORS.standby), transparent: true, opacity: 0.75, depthWrite: false });
    var aura = new THREE.Sprite(auraMat);
    aura.scale.set(AURA_SCALE, AURA_SCALE, 1);
    group.add(aura);

    var counter = makeCounterSprite();
    counter.sprite.position.set(0, -(NODE_RADIUS + 0.32), 0);
    group.add(counter.sprite);

    var labelSprite = makeLabelSprite(SOURCE_LABELS[i]);
    labelSprite.sprite.position.set(0, NODE_RADIUS + 0.52, 0);
    group.add(labelSprite.sprite);

    scene.add(group);
    nodeData.push({ name: SOURCE_NAMES[i], label: SOURCE_LABELS[i], group: group, sphere: sphere, aura: aura, counter: counter, labelSprite: labelSprite, count: 0 });
  }
  // -- Connection lines: core -> all 16 satellites + faint neighbor mesh --
  var linkVerts = [];
  for (var j = 0; j < 16; j++) {
    linkVerts.push(0, 0, 0);
    linkVerts.push(nodeData[j].group.position.x, nodeData[j].group.position.y, nodeData[j].group.position.z);
  }
  for (var k = 0; k < 16; k++) {
    var p = nodeData[k].group.position;
    var nearest = [];
    for (var m = 0; m < 16; m++) {
      if (m === k) continue;
      nearest.push({ idx: m, d: p.distanceTo(nodeData[m].group.position) });
    }
    nearest.sort(function (a, b) { return a.d - b.d; });
    for (var n = 0; n < 3; n++) {
      var q = nodeData[nearest[n].idx].group.position;
      linkVerts.push(p.x, p.y, p.z, q.x, q.y, q.z);
    }
  }
  var coreGeo = new THREE.BufferGeometry();
  coreGeo.setAttribute('position', new THREE.Float32BufferAttribute(linkVerts, 3));
  lineGroup.add(new THREE.LineSegments(coreGeo, coreLineMat));

  var meshLinkVerts = [];
  for (var a = 0; a < 16; a++) {
    var pa = nodeData[a].group.position;
    for (var b = a + 1; b < 16; b++) {
      var pb = nodeData[b].group.position;
      if (pa.distanceTo(pb) < 5.4) meshLinkVerts.push(pa.x, pa.y, pa.z, pb.x, pb.y, pb.z);
    }
  }
  var meshGeo = new THREE.BufferGeometry();
  meshGeo.setAttribute('position', new THREE.Float32BufferAttribute(meshLinkVerts, 3));
  lineGroup.add(new THREE.LineSegments(meshGeo, meshMat));

  // -- Energy laser pulse beam (core -> target node, fades over 1.2s) --
  var laserGeo = new THREE.BufferGeometry();
  laserGeo.setAttribute('position', new THREE.Float32BufferAttribute([0, 0, 0, 0, 0, 0], 3));
  var laserMat = new THREE.LineBasicMaterial({ color: 0xf39c12, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false });
  var laser = new THREE.Line(laserGeo, laserMat);
  laser.frustumCulled = false;
  laser.visible = false;
  scene.add(laser);
  var laserT = -1;

  function fireLaser(idx) {
    var target = nodeData[idx].group.position;
    var attr = laserGeo.attributes.position;
    attr.setXYZ(0, 0, 0, 0);
    attr.setXYZ(1, target.x, target.y, target.z);
    attr.needsUpdate = true;
    laserT = 0;
    laser.visible = true;
  }

  function setAura(idx, hex) {
    var mat = nodeData[idx].aura.material;
    mat.map = makeGlowTexture(hex);
    mat.map.needsUpdate = true;
    mat.needsUpdate = true;
  }
  // -- HUD helpers --
  function normalizeTitle(t) {
    if (!t) return 'Untitled';
    return String(t).replace(/\s+/g, ' ').trim().slice(0, 160);
  }
  function badgeForScore(s) { return s >= 8 ? 'ELITE' : (s >= 6 ? 'ACCEPT' : 'REJECT'); }
  function auraForScore(s) {
    if (s >= 8) return STATE_COLORS.healthy;
    if (s >= 5.5) return STATE_COLORS.cooldown;
    return STATE_COLORS.error;
  }
  function pipelineForSource(src) {
    var s = String(src || '').toLowerCase();
    if (s.indexOf('historic') !== -1 || s.indexOf('archive') !== -1) return 'Historic';
    return 'Daily';
  }

  var elTitle = document.getElementById('hud-title');
  var elScore = document.getElementById('hud-score');
  var elReward = document.getElementById('hud-reward');
  var elProvider = document.getElementById('hud-provider');
  var elSource = document.getElementById('hud-source');
  var elPipeline = document.getElementById('hud-pipeline');

  function updateHud(p) {
    elTitle.textContent = p.title || 'Untitled';
    var badge = p.badge || badgeForScore(p.score);
    var scoreTxt = (p.score != null && isFinite(p.score)) ? '  ' + p.score.toFixed(1) : '';
    elScore.textContent = badge + scoreTxt;
    elScore.className = 'hud-score ' + badge;
    elReward.textContent = (p.reward != null) ? Number(p.reward).toFixed(3) : '--';
    elProvider.textContent = p.provider || '--';
    elSource.textContent = p.sourceLabel || p.source || '--';
    elPipeline.textContent = (p.pipeline === 'Historic') ? 'HISTORIC ARCHIVE' : (p.pipeline === 'DRL' ? 'DRL FORAGER' : 'DAILY SEARCH');
    elPipeline.className = 'hud-badge ' + p.pipeline;
  }

  function sourceIndex(src) {
    var s = String(src || '').toLowerCase();
    for (var i = 0; i < SOURCE_NAMES.length; i++) {
      if (s.indexOf(SOURCE_NAMES[i]) !== -1 || SOURCE_NAMES[i].indexOf(s) !== -1) return i;
    }
    var h = 0;
    for (var j = 0; j < s.length; j++) h = (h * 31 + s.charCodeAt(j)) | 0;
    return ((h % 16) + 16) % 16;
  }

  var recentlyHandled = new Set();
  function dedupeKey(p) {
    var t = normalizeTitle(p.title || p.Title);
    var s = parseFloat(p.overall_score != null ? p.overall_score : (p.score != null ? p.score : 0));
    if (isNaN(s)) s = 0;
    return t + '|' + s.toFixed(1);
  }
  function isDuplicate(key, p) {
    if (!p.title && !p.Title) return false;
    if (recentlyHandled.has(key)) return true;
    recentlyHandled.add(key);
    if (recentlyHandled.size > 500) recentlyHandled.delete(recentlyHandled.values().next().value);
    return false;
  }

  function handlePaper(p) {
    if (!p) return;
    var key = dedupeKey(p);
    if (isDuplicate(key, p)) return;
    var title = normalizeTitle(p.title || p.Title);
    var score = parseFloat(p.overall_score != null ? p.overall_score : (p.score != null ? p.score : 0));
    if (isNaN(score)) score = 0;
    var idx = sourceIndex(p.source);
    fireLaser(idx);
    setAura(idx, auraForScore(score));
    nodeData[idx].count += 1;
    drawCounter(nodeData[idx].counter, nodeData[idx].count);
    updateHud({ title: title, score: score, badge: badgeForScore(score), reward: p.reward, provider: p.provider, source: p.source, sourceLabel: nodeData[idx].label, pipeline: pipelineForSource(p.source) });
  }
  // -- Live source telemetry (pre-flight health + ingestion status events) --
  function setAuraByStatus(idx, status) {
    setAura(idx, STATE_COLORS[status] || STATE_COLORS.standby);
  }

  function handleSourceSearching(p) {
    var idx = sourceIndex(p.source);
    fireLaser(idx);
    setAura(idx, STATE_COLORS.cooldown);
    elTitle.textContent = 'Searching ' + nodeData[idx].label + '...';
    elScore.textContent = 'SEARCHING';
    elScore.className = 'hud-score ACCEPT';
    elReward.textContent = '--';
    elProvider.textContent = '--';
    elSource.textContent = nodeData[idx].label;
    elPipeline.textContent = 'LIVE TELEMETRY';
    elPipeline.className = 'hud-badge DRL';
  }

  function handleSourceStatus(p) {
    var idx = sourceIndex(p.source);
    var status = p.status || 'standby';
    setAuraByStatus(idx, status);
    if (p.count != null && !isNaN(Number(p.count))) {
      nodeData[idx].count = Number(p.count);
      drawCounter(nodeData[idx].counter, nodeData[idx].count);
    }
    elTitle.textContent = nodeData[idx].label + ' - ' + String(status).toUpperCase();
    elScore.textContent = String(status).toUpperCase();
    elScore.className = 'hud-score ' + (status === 'error' ? 'REJECT' : 'ACCEPT');
    elReward.textContent = (p.count != null ? String(p.count) : '--');
    elProvider.textContent = '--';
    elSource.textContent = nodeData[idx].label;
    elPipeline.textContent = 'SOURCE STATUS';
    elPipeline.className = 'hud-badge DRL';
  }

  function handleSourceTelemetry(evt) {
    var p = evt.payload || {};
    if (evt.event_type === 'source_searching') handleSourceSearching(p);
    else if (evt.event_type === 'source_status') handleSourceStatus(p);
  }

  // -- Pure AJAX polling engine (1-second interval, cache-busted) --
  var lastSeenEvalId = null;
  var pollTimer = null;

  async function pollState() {
    try {
      var res = await fetch('/api/v1/visualizer/state?_t=' + Date.now(), {
        cache: 'no-store',
        headers: { 'Cache-Control': 'no-cache, no-store, must-revalidate', 'Pragma': 'no-cache' }
      });
      if (!res.ok) return;
      var data = await res.json();
      applyStateUpdate(data);
    } catch (e) { /* backend offline; retry next tick */ }
  }

  function applyStateUpdate(data) {
    if (!data) return;

    // -- Refresh all 16 node auras + count badges from source health --
    var sources = data.sources || {};
    Object.keys(sources).forEach(function (slug) {
      var idx = sourceIndex(slug);
      var info = sources[slug];
      setAuraByStatus(idx, info.status || 'standby');
      if (info.count != null && !isNaN(Number(info.count))) {
        nodeData[idx].count = Number(info.count);
        drawCounter(nodeData[idx].counter, nodeData[idx].count);
      }
    });

    // -- New evaluation? Fire laser + refresh the HUD card --
    var ev = data.latest_evaluation;
    if (ev && ev.id != null && ev.id !== lastSeenEvalId) {
      lastSeenEvalId = ev.id;
      var idx = sourceIndex(ev.source);
      fireLaser(idx);
      var score = parseFloat(ev.overall_score);
      if (isNaN(score)) score = 0;
      updateHud({
        title: normalizeTitle(ev.title),
        score: score,
        badge: badgeForScore(score),
        reward: ev.reward,
        provider: ev.provider,
        source: ev.source,
        sourceLabel: nodeData[idx].label,
        pipeline: pipelineForSource(ev.source)
      });
    }
  }

  function startPolling() {
    if (pollTimer) clearInterval(pollTimer);
    pollState();
    pollTimer = setInterval(pollState, 1000);
  }

  // -- Conference offline replay --
  var replayEvents = [];
  var replayIndex = 0;
  var replayPlaying = false;
  var replaySpeed = 1;
  var replayTimer = null;

  function loadDemoData() {
    return fetch('/api/v1/visualizer/demo-data?limit=200')
      .then(function (r) { return r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)); })
      .then(function (papers) {
        replayEvents = papers || [];
        document.getElementById('rp-timeline').max = Math.max(replayEvents.length, 0);
        document.getElementById('rp-timeline').value = 0;
        document.getElementById('rp-status').textContent = '0 / ' + replayEvents.length;
        replayIndex = 0;
        return replayEvents.length;
      })
      .catch(function () { replayEvents = []; return 0; });
  }
  function startReplay() {
    if (replayTimer) clearInterval(replayTimer);
    replayPlaying = true;
    replayTimer = setInterval(function () {
      if (!replayPlaying) return;
      if (replayIndex >= replayEvents.length) { pauseReplay(); document.getElementById('rp-play').textContent = 'PLAY'; return; }
      handlePaper(replayEvents[replayIndex++]);
      document.getElementById('rp-timeline').value = replayIndex;
      document.getElementById('rp-status').textContent = replayIndex + ' / ' + replayEvents.length;
    }, Math.max(300, 1200 / replaySpeed));
  }
  function pauseReplay() {
    replayPlaying = false;
    if (replayTimer) clearInterval(replayTimer);
    replayTimer = null;
  }
  function seekReplay(v) {
    replayIndex = parseInt(v) || 0;
    document.getElementById('rp-status').textContent = replayIndex + ' / ' + replayEvents.length;
  }
  // -- Orbit camera controls (drag rotate, right-click pan, wheel zoom) --
  var dragging = false, dragButton = 0, lastX = 0, lastY = 0;
  renderer.domElement.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  renderer.domElement.addEventListener('mousedown', function (e) {
    dragging = true; dragButton = e.button; lastX = e.clientX; lastY = e.clientY;
    if (dragButton === 2) renderer.domElement.classList.add('panning');
  });
  window.addEventListener('mousemove', function (e) {
    if (!dragging) return;
    var dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    if (dragButton === 0) {
      orbit.theta -= dx * 0.005;
      orbit.phi -= dy * 0.005;
      orbit.phi = Math.max(0.05, Math.min(Math.PI - 0.05, orbit.phi));
    } else if (dragButton === 2) {
      var forward = new THREE.Vector3(); camera.getWorldDirection(forward);
      var rightV = new THREE.Vector3().crossVectors(forward, camera.up).normalize();
      var upV = new THREE.Vector3().crossVectors(rightV, forward).normalize();
      var panScale = orbit.radius * 0.0012;
      panTarget.addScaledVector(rightV, -dx * panScale);
      panTarget.addScaledVector(upV, dy * panScale);
    }
  });
  window.addEventListener('mouseup', function () { dragging = false; renderer.domElement.classList.remove('panning'); });
  renderer.domElement.addEventListener('wheel', function (e) {
    e.preventDefault();
    orbit.radius *= (1 + Math.sign(e.deltaY) * 0.08);
    orbit.radius = Math.max(4, Math.min(40, orbit.radius));
  }, { passive: false });

  function resetCamera() {
    orbit = { theta: 0, phi: Math.PI / 6, radius: 14 };
    panTarget.set(0, 0, 0);
  }

  // -- Theme switching --
  function applyTheme(print) {
    printTheme = print;
    renderer.setClearColor(print ? 0xffffff : 0x0f1117, 1);
    document.body.classList.toggle('print-theme', print);
    buildGrid(print);
    coreMat.color.set(print ? 0x002855 : 0xf39c12);
    innerMat.color.set(print ? 0x002855 : 0xf39c12);
    coreLineMat.color.set(print ? 0x33445a : 0x2a3a4f);
    meshMat.color.set(print ? 0x55606e : 0x1a2634);
    laserMat.color.set(print ? 0x002855 : 0xf39c12);
    for (var i = 0; i < nodeData.length; i++) {
      nodeData[i].sphere.material.color.set(print ? 0x002855 : 0x00ced1);
      drawCounter(nodeData[i].counter, nodeData[i].count);
      drawLabel(nodeData[i].labelSprite, nodeData[i].label);
    }
  }

  window.addEventListener('resize', function () {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // -- Animation loop --
  var clock = new THREE.Clock();
  function animate() {
    requestAnimationFrame(animate);
    var dt = Math.min(clock.getDelta(), 0.1);

    core.rotation.y += dt * 0.35;
    core.rotation.x += dt * 0.12;
    innerCore.rotation.y -= dt * 0.5;
    innerCore.rotation.z += dt * 0.2;

    for (var i = 0; i < nodeData.length; i++) {
      var s = 1 + 0.06 * Math.sin(clock.elapsedTime * 2 + i);
      nodeData[i].sphere.scale.setScalar(s);
    }

    if (laserT >= 0) {
      laserT += dt;
      var t = laserT / 1.2;
      if (t >= 1) { laser.visible = false; laserT = -1; laserMat.opacity = 0; }
      else { laserMat.opacity = Math.max(0, 1 - t); }
    }

    camera.position.set(
      panTarget.x + orbit.radius * Math.sin(orbit.phi) * Math.sin(orbit.theta),
      panTarget.y + orbit.radius * Math.cos(orbit.phi),
      panTarget.z + orbit.radius * Math.sin(orbit.phi) * Math.cos(orbit.theta)
    );
    camera.lookAt(panTarget);

    renderer.render(scene, camera);
  }

  // -- UI wiring --
  function setMode(mode) {
    currentMode = mode;
    document.getElementById('btn-live').classList.toggle('active', mode === 'live');
    document.getElementById('btn-replay').classList.toggle('active', mode === 'replay');
    document.getElementById('replay').classList.toggle('visible', mode === 'replay');
    document.getElementById('mode-indicator').textContent = mode === 'live' ? 'LIVE AJAX POLLING' : 'CONFERENCE OFFLINE REPLAY';
    if (mode === 'live') {
      pauseReplay();
      startPolling();
    } else {
      recentlyHandled.clear();
      loadDemoData().then(function (count) {
        document.getElementById('rp-play').textContent = 'PLAY';
        if (count > 0) document.getElementById('mode-indicator').textContent = 'CONFERENCE REPLAY (' + count + ' papers)';
      });
    }
  }

  document.getElementById('btn-live').addEventListener('click', function () { setMode('live'); });
  document.getElementById('btn-replay').addEventListener('click', function () { setMode('replay'); });
  document.getElementById('btn-theme').addEventListener('click', function () {
    applyTheme(!printTheme);
    this.classList.toggle('active', printTheme);
    this.textContent = printTheme ? 'THEME: PRINT' : 'THEME';
  });
  document.getElementById('btn-reset').addEventListener('click', resetCamera);
  document.getElementById('rp-play').addEventListener('click', function () {
    if (replayPlaying) { pauseReplay(); this.textContent = 'PLAY'; }
    else { startReplay(); this.textContent = 'PAUSE'; }
  });
  document.getElementById('rp-speed').addEventListener('click', function () {
    var speeds = [1, 2, 5];
    var cur = parseInt(this.dataset.speed || '1');
    var next = speeds[(speeds.indexOf(cur) + 1) % speeds.length];
    this.dataset.speed = next; this.textContent = next + 'x'; replaySpeed = next;
    if (replayPlaying) startReplay();
  });
  document.getElementById('rp-timeline').addEventListener('input', function () { seekReplay(this.value); });

  window.addEventListener('keydown', function (e) {
    if (e.key === 'r' || e.key === 'R') resetCamera();
    if (e.key === 't' || e.key === 'T') document.getElementById('btn-theme').click();
  });

  // -- Bootstrap --
  startPolling();
  animate();
})();
</script>
</body>
</html>
