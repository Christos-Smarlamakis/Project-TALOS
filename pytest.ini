[pytest]
testpaths = tests
norecursedirs = vendor cherry_ui_isolated .git data models logs templates tools docs .vscode _profiles __pycache__
addopts = --ignore=tests/test_smoke.py --color=yes -v
; v5.11.3: pytest overrides import-time warning filters (simplefilter "always"),
; so the google.generativeai end-of-support FutureWarning is suppressed here
; for the test suite; the in-code filters in ai_manager._try_import_genai()
; cover normal runtime (CLI/TUI/server) execution.
filterwarnings =
    ignore:All support for the .*:FutureWarning
    ignore::FutureWarning
