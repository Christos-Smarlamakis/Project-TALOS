# TALOS v5.10.14 — Docker Compose configuration
# Headless FastAPI service on port 8001. Local Ollama runs on the host and is
# reached through host.docker.internal (see docs/DOCKER.md for full instructions).

services:
  talos:
    build: .
    image: talos:5.10.14
    container_name: talos_api
    stdin_open: true
    tty: true
    ports:
      - "8001:8001"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
      - ./_profiles:/app/_profiles
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONIOENCODING=utf-8
      - TALOS_API_PORT=8001
      # Reach the host-side local model services from inside the container.
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - FAST_EDGE_BASE_URL=http://host.docker.internal:11435/v1
      - LOCAL_MODEL_BASE_URL=http://host.docker.internal:11434/v1
    restart: unless-stopped