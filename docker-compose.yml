# TALOS v5.8.2 — Docker Compose configuration
# Multi-tier LLM routing with dedicated FastAPI container on port 8001.
version: '3.8'

services:
  talos_api:
    build: .
    container_name: talos_api_v5.8.2
    stdin_open: true
    tty: true
    ports:
      - "8001:8001"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - TALOS_API_PORT=8001
    restart: unless-stopped