# TALOS v5.3.0 — Docker Compose configuration
version: '3.8'

services:
  talos:
    build: .
    container_name: project_talos
    # Απαραίτητο για το διαδραστικό μενού
    stdin_open: true
    tty: true
    # Συνδέουμε τον φάκελό μας για να μην χάνονται τα δεδομένα
    volumes:
      - .:/app
    # Ports: Flask Dashboard + Streamlit GUI
    ports:
      - "5000:5000"
      - "8501:8501"
    # Πρόσβαση στο Ollama του host (για generate_docs.py, local AI)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Φορτώνουμε τα API Keys
    env_file:
      - .env
